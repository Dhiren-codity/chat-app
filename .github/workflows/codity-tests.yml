name: Codity AI - Run Generated Tests

on:
  pull_request:
    branches: ['**']

permissions:
  contents: write
  pull-requests: write

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio openai
          # Fix Flask ecosystem compatibility issues
          pip install 'sqlalchemy<2.0.0' 'flask-sqlalchemy>=3.0.0' || true
          pip install 'werkzeug<3.0.0' 'flask>=2.3.0,<3.0.0' || true
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
      - name: Run tests
        id: test_run
        continue-on-error: true
        run: pytest app_test.py profile_manager_test.py user_validator_test.py -v
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."
          python3 test_generation/execution/github_auto_fix.py app_test.py profile_manager_test.py user_validator_test.py
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: pytest app_test.py profile_manager_test.py user_validator_test.py -v
      - name: Commit auto-fixed tests
        # CRITICAL FIX: Commit if ANY auto-fix happened, not just if tests fully pass
        # This allows incremental improvements (90 passing -> keep those 90)
        if: steps.test_run.outcome == 'failure'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add app_test.py profile_manager_test.py user_validator_test.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Auto-fixed failing tests

            🤖 Generated with Codity AI
            "
            # CRITICAL FIX: No git pull --rebase - just push with force-with-lease
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi

  test-javascript:
    name: JavaScript/TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies in .
        run: |
          cd .
          npm ci || npm install
      - name: Run tests
        id: test_run
        continue-on-error: true
        run: npm test chatUtils.test.ts messageFormatter.test.js
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."
          python3 test_generation/execution/github_auto_fix.py chatUtils.test.ts messageFormatter.test.js
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: npm test chatUtils.test.ts messageFormatter.test.js
      - name: Commit auto-fixed tests
        # CRITICAL FIX: Commit if ANY auto-fix happened
        if: steps.test_run.outcome == 'failure'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add chatUtils.test.ts messageFormatter.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Auto-fixed failing JavaScript/TypeScript tests"
            # CRITICAL FIX: No git pull --rebase - just push
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies for auto-fix
        run: |
          pip install openai anthropic || true
      - name: Run Go tests
        id: test_run
        continue-on-error: true
        run: |
          cd go-services
          go mod download
          go test ./... -v
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."
          python3 test_generation/execution/github_auto_fix.py go-services/message_validator_test.go
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: |
          cd go-services
          go test ./... -v
      - name: Commit auto-fixed tests
        # CRITICAL FIX: Commit if ANY auto-fix happened
        if: steps.test_run.outcome == 'failure'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add go-services/message_validator_test.go
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Auto-fixed failing Go tests"
            # CRITICAL FIX: No git pull --rebase - just push
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi
