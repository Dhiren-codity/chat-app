name: Codity AI - Run Generated Tests

on:
  pull_request:
    branches: ['**']

permissions:
  contents: write
  pull-requests: write

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio openai
          # Fix Flask ecosystem compatibility issues
          pip install 'sqlalchemy<2.0.0' 'flask-sqlalchemy>=3.0.0' || true
          pip install 'werkzeug<3.0.0' 'flask>=2.3.0,<3.0.0' || true
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
      - name: Run tests
        id: test_run
        continue-on-error: true
        run: pytest app_test.py profile_manager_test.py user_validator_test.py -v
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."
          python3 test_generation/execution/github_auto_fix.py app_test.py profile_manager_test.py user_validator_test.py
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: pytest app_test.py profile_manager_test.py user_validator_test.py -v
      - name: Commit auto-fixed tests
        if: steps.test_run.outcome == 'failure' && steps.retest.outcome == 'success'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add app_test.py profile_manager_test.py user_validator_test.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Auto-fixed failing tests

            🤖 Generated with Codity AI
            "
            # Pull and rebase to handle any remote changes
            git pull --rebase origin ${{ github.head_ref }} || true
            # Push with force-with-lease to safely overwrite
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies for auto-fix
        run: |
          pip install openai anthropic || true
      - name: Run Go tests
        id: test_run
        continue-on-error: true
        run: |
          cd go-services
          go mod download
          go test ./... -v
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."
          python3 test_generation/execution/github_auto_fix.py go-services/message_validator_test.go
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: |
          cd go-services
          go mod download
          go test ./... -v
      - name: Commit auto-fixed tests
        if: steps.test_run.outcome == 'failure' && steps.retest.outcome == 'success'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add go-services/message_validator_test.go
          # Also add go.mod and go.sum if they were updated
          git add */go.mod */go.sum go.mod go.sum 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Auto-fixed failing Go tests"
            git pull --rebase origin ${{ github.head_ref }} || true
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi

  test-java:
    name: Java Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies for auto-fix
        run: |
          pip install openai anthropic || true
      - name: Run Java tests
        id: test_run
        continue-on-error: true
        run: |
          cd java-services
          mvn test
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."
          python3 test_generation/execution/github_auto_fix.py java-services/src/test/java/com/chatapp/services/UserServiceTest.java
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: |
          cd java-services
          mvn test
      - name: Commit auto-fixed tests
        if: steps.test_run.outcome == 'failure' && steps.retest.outcome == 'success'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add java-services/src/test/java/com/chatapp/services/UserServiceTest.java
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Auto-fixed failing Java tests"
            git pull --rebase origin ${{ github.head_ref }} || true
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi
